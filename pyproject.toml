[project]
name = "minijsrt-exercises"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hunter Flechsig", email = "hunterflechsig@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.1",
    "opencv-python>=5.0.0.93",
    "pydicom>=3.0.2",
    "scikit-learn>=1.9.1",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]

[project.scripts]
minijsrt-exercises = "minijsrt_exercises:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"
